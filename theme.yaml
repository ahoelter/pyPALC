attrs:
    Plot:
        background_fill_color: "#323030"
        border_fill_color: "#323030"
        outline_line_color: "white"
        stylesheets:
            - |
                :host {
                  max-width: none;
                  }
    Axis:
        axis_line_color: "white"
        axis_label_text_color: "white"
        major_label_text_color: "white"
        major_label_text_font_size: "10pt"
        major_label_text_font: "Helvetica"
        major_tick_line_color: "white"
        minor_tick_line_color: "white"
        axis_label_text_font_size: "10pt"
        axis_label_text_font: "Helvetica"
        axis_label_text_font_style: "normal"
    Grid:
        grid_line_dash: [6, 4]
        grid_line_alpha: .3
        grid_line_color: "white"
        minor_grid_line_color: "white"
        minor_grid_line_alpha: .1
    Title:
        background_fill_color: "#323030"
        text_color: "white"
        text_font_size: "10pt"
        text_font: "Helvetica"
    Label:
        background_fill_color: "#323030"
        text_color: "white"
        text_font: "Helvetica"
    Legend:
        background_fill_color: "#323030"
        border_line_color: "#323030"
        title_text_color: "white"
        title_text_font: "Helvetica"
        label_text_color: "white"
        label_text_font: "Helvetica"
        label_text_font_size: "10pt"
    ColorBar:
        background_fill_color: "#323030"
        title_text_color: "white"
        title_text_font_size: "10pt"
        title_text_font: "Helvetica"
        major_tick_line_color: "white"
        minor_tick_line_color: "white"
        major_label_text_color: "white"
        major_label_text_font: "Helvetica"
        label_standoff: 7
        major_label_text_font_size: "10pt"
    Div:
        stylesheets:
            - |
                a:link {
                  color: green;
                  }
                a:visited {
                  color: green;
                  }
                a:hover {
                  color: white;
                  }
                a:active {
                  color: green;
                  }
                p {
                  margin: 1em 0;
                  }
    DataTable:
        stylesheets:
            - |
                .slick-header-columns, .slick-headerrow-columns, .slick-footerrow-columns {
                  overflow: visible !important;
                  border-left: 0px solid #323030 !important;
                  border-top: 2px solid white !important;
                  border-bottom: 0px solid #323030 !important;
                  border-right: 0px solid #323030 !important;
                  }
                .slick-header-column.ui-state-default {
                  border-left: 0px solid #323030 !important;
                  border-top: 0px solid white !important;
                  border-bottom: 1px solid white !important;
                  border-right: 0px solid #323030 !important;
                  }
                .slick-cell, .slick-headerrow-column, .slick-footerrow-column {
                  border-right: 0px solid white !important;
                  border-left: 0px solid white !important;
                  }
                .slick-header, .slick-header-columns {
                  background-color: transparent !important;
                  }
                .slick-header-column {
                  background-color: #323030 !important;
                  background-image: none !important;
                  }
                .slick-row {
                  background-color: #323030 !important;
                  background-image: none !important;
                  color: white !important;
                  overflow: hidden;
                  }
                .bk-cell-index {
                  background-color: #323030 !important;
                  background-image: none !important;
                  color: white !important;
                  }
                .slick-cell.selected {
                  background-color: darkred !important;
                  }
    Button:
        stylesheets:
            - |
                .bk-btn {
                  line-height: round(up, var(--line-height-computed), 1px);
                  }
    RadioButtonGroup:
        stylesheets:
            - |
                .bk-btn {
                  line-height: round(up, var(--line-height-computed), 1px);
                  }
    Toggle:
        stylesheets:
            - |
                .bk-btn {
                  line-height: round(up, var(--line-height-computed), 1px);
                  }
                .bk-btn-success.bk-active {
                  background-color: darkred !important;
                  border-color: #403030;
                  }
                .bk-btn-success.bk-active:after {
                  content: "ning...";
                  }
    Tabs:
        stylesheets:
            - |
                :host {
                  --divider-color: #e6e6e6;
                  }
                .bk-tab {
                  color: #666666;
                  line-height: round(up, var(--line-height-computed), 1px);
                  }
                .bk-tab:hover {
                  background-color: #f2f2f2;
                  }
                .bk-tab.bk-active {
                  color: #4d4d4d;
                  background-color: white;
                  border-color: #e6e6e6;
                  }
    Paragraph:
        stylesheets:
            - |
                :host {
                  line-height: round(up, var(--line-height-computed), 1px);
                  }
    Toolbar:
        stylesheets:
            - |
                :host(.bk-left), :host(.bk-right) {
                  height: auto !important;
                  padding-bottom: 16px;
                  }
                :host > * {
                  --active-border: #26aae1;
                  }
    InputWidget:
        stylesheets:
            - |
                :host {
                  --input-min-height: 31px;
                  --border-color: #ccc;
                  --input-focus-border-color: #66afe9;
                  --input-focus-halo-color: rgba(102, 175, 233, 0.6);
                  --disabled-background-color: #eee;
                  --placeholder-color: #999;
                  }
    FileInput:
        stylesheets:
            - |
                input[type=file].bk-input {
                  background-color: transparent;
                  border: none;
                  border-radius: 0;
                  min-height: 0;
                  padding: 0;
                  }
                input[type=file]::file-selector-button {
                  all: revert;
                  }